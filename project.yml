name: LamportBuild
options:
  bundleIdPrefix: si.lamport
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.10.1
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  LamportBuild:
    type: application
    platform: macOS
    sources:
      - Sources
      # asset catalog and THIRD_PARTY_NOTICES (the bundled engine's licenses) go to Contents/Resources
      - path: Resources
        excludes: [THIRD_PARTY_NOTICES]
      - path: Resources/THIRD_PARTY_NOTICES
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
    postBuildScripts:
      - name: Bundle engine
        basedOnDependencyAnalysis: false
        script: |
          src="$SRCROOT/engine"
          dst="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/engine"
          if [ -x "$src/lamport-engine" ] && [ -f "$src/engine.json" ]; then
            mkdir -p "$dst"
            rsync -a --delete "$src/" "$dst/"
          else
            echo "warning: no engine in $src; the app will start without one"
          fi
    settings:
      base:
        PRODUCT_NAME: Lamport Build
        PRODUCT_BUNDLE_IDENTIFIER: si.lamport.build.mac
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
