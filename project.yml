name: LamportBuild
options:
  bundleIdPrefix: si.lamport
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  LamportBuild:
    type: application
    platform: macOS
    sources: [Sources]
    resources: [Resources]
    settings:
      base:
        PRODUCT_NAME: Lamport Build
        PRODUCT_BUNDLE_IDENTIFIER: si.lamport.build.mac
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
